# =============================================================================
# Building Coverage Mapping & Change Detection | Varanasi
# Central configuration. Every script reads this file through src/config.py,
# so a parameter is changed in exactly one place.
# =============================================================================

project:
  name: varanasi-building-mapping
  seed: 42                      # used for the spatial split, model init, sampling

# -----------------------------------------------------------------------------
# Study area. All geometry is defined on a projected UTM grid so that pixels
# are square 10 m cells and areas can be computed as pixel_count * 100 m^2.
# Varanasi (~83.0 E) lies in UTM zone 44N -> EPSG:32644.
# -----------------------------------------------------------------------------
study_area:
  crs: EPSG:32644
  # Centre of central Varanasi on the west bank of the Ganga (lon, lat, WGS84).
  # Chosen BEFORE any change results were computed: it sits between Sigra,
  # Lahurabir and the Godowlia old city.
  center_lonlat: [82.9750, 25.3150]
  pixel_size_m: 10
  # "Wide" area: used to train/validate/test the U-Net. 24 x 24 tiles of
  # 64 px = 1536 x 1536 px = 15.36 km x 15.36 km.
  wide_size_tiles: 24
  # "Core" area: the ~25 km^2 reporting area for coverage and change.
  core_size_m: 5000

# -----------------------------------------------------------------------------
# Sentinel-2 imagery
# -----------------------------------------------------------------------------
imagery:
  # Which acquisition path to use: "planetary_computer" (no account needed)
  # or "gee" (needs Earth Engine authentication + a Cloud project id).
  source: planetary_computer
  gee_project: null            # e.g. "my-varanasi-project"; never commit secrets
  # Bands used by the model. B2/B3/B4/B8 are native 10 m; B11/B12 are native
  # 20 m (SWIR) and are bilinearly resampled onto the 10 m grid.
  bands: [B02, B03, B04, B08, B11, B12]
  bands_10m: [B02, B03, B04, B08]
  bands_20m: [B11, B12]
  # Same season in every year (dry pre-monsoon, Feb-May) to limit
  # phenology/monsoon differences between periods.
  periods:
    "2020": ["2020-02-01", "2020-05-31"]
    "2023": ["2023-02-01", "2023-05-31"]   # closest to the Open Buildings V3 era; used for training
    "2025": ["2025-02-01", "2025-05-31"]
  train_period: "2023"
  change_periods: ["2020", "2025"]
  max_scene_cloud_pct: 20       # scene-level filter (whole-tile cloud %)
  max_scenes: 12                # lowest-cloud scenes kept per period
  # Scene Classification Layer classes treated as invalid (pixel-level mask):
  # 0 no data, 1 saturated/defective, 3 cloud shadow, 8 cloud medium prob,
  # 9 cloud high prob, 10 thin cirrus, 11 snow/ice.
  scl_invalid_classes: [0, 1, 3, 8, 9, 10, 11]
  composite: median
  reflectance_scale: 10000      # DN / 10000 = surface reflectance
  nodata: -9999.0
  min_valid_observations: 2     # pixels with fewer clear looks become nodata

# -----------------------------------------------------------------------------
# Building reference labels (Google Open Buildings V3)
# -----------------------------------------------------------------------------
labels:
  source: open_buildings_v3
  # Public bucket used by the no-account path; files are split by S2 level-6 cell.
  bucket_url: https://storage.googleapis.com/open-buildings-data/v3/polygons_s2_level_6_gzip_no_header
  gee_collection: GOOGLE/Research/open-buildings/v3/polygons
  # Google suggests ~0.65-0.75 depending on the precision you want; 0.70 is a
  # middle setting. Polygons below this confidence are dropped.
  min_confidence: 0.70
  # Rasterization rule: footprints are burned onto a 2 m sub-grid (5 x 5
  # sub-pixels per 10 m pixel), averaged back to 10 m to give the fraction of
  # each pixel covered by roofs; a pixel is "building" if fraction >= threshold.
  supersample: 5
  coverage_threshold: 0.25

# -----------------------------------------------------------------------------
# Tiling and spatial split
# -----------------------------------------------------------------------------
tiling:
  tile_size: 64                 # 64 px * 10 m = 640 m on the ground
  stride: 64                    # = tile_size -> non-overlapping tiles
  edge_policy: discard          # partial edge tiles are not used for training
  min_valid_fraction: 0.95      # tiles with more nodata than 5% are discarded
  keep_empty_tiles: true        # tiles with no buildings are kept (real negatives)

split:
  # Tiles are grouped into square geographic blocks; each whole block goes to
  # exactly one split so neighbouring (correlated) tiles stay together.
  block_size_tiles: 4           # 4 x 4 tiles = 2.56 km blocks
  fractions: {train: 0.70, val: 0.15, test: 0.15}

# -----------------------------------------------------------------------------
# Model and training
# -----------------------------------------------------------------------------
model:
  in_channels: 6
  base_channels: 32
  depth: 4                      # 64 -> 32 -> 16 -> 8 -> 4 at the bottleneck
  dropout: 0.1

training:
  epochs: 80
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  loss: bce_dice                # BCEWithLogits (pos_weight) + soft Dice
  dice_weight: 0.5
  early_stopping_patience: 15
  selection_metric: val_iou     # best checkpoint = highest validation IoU
  augment: true                 # random flips / 90-degree rotations (train only)
  num_workers: 0                # 0 is safest on Windows

evaluation:
  default_threshold: 0.5
  # The decision threshold is tuned on the VALIDATION split only.
  threshold_search: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

inference:
  window: 64
  stride: 32                    # overlapping windows, averaged, to remove seams

change:
  # "High-confidence" change additionally requires the probability to move
  # across a margin around the threshold (reduces flicker from noise).
  confidence_margin: 0.2

vectorization:
  connectivity: 8               # 8-neighbour connectivity when forming regions
  min_region_pixels: 2          # regions smaller than this are dropped (speckle)
  opening_kernel: 0             # OpenCV morphological opening kernel; 0 = off

object_evaluation:
  iou_threshold: 0.5            # one-to-one match needs polygon IoU >= 0.5
